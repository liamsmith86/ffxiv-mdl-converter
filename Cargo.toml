[package]
name = "ffxiv_mdl_converter"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Standalone GPL FFXIV MDL <-> TexTools DB converter"
publish = false

[dependencies]
anyhow = "1.0"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
half = "2.4"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = "thin"
codegen-units = 1
