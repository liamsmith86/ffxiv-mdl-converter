[package]
name = "ffxiv_mdl_converter"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Standalone GPL FFXIV MDL <-> TexTools DB converter"
publish = false

[dependencies]
anyhow = "1.0.104"
byteorder = "1.5"
clap = { version = "4.6.7", features = ["derive"] }
half = "2.7.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
